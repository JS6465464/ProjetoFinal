                        <h2 id="tituloConfiguracoes">Escolhe o teu nome</h2>
                        <button id="fecharConfiguracoes" class="botao-fechar" type="button" aria-label="Fechar">×</button>
                    </div>

                    <!-- MENU PRINCIPAL -->
                    <div id="menuNomes">
                        <button id="abrirNomes" class="botao-tipo-nome" type="button">
                            <span class="icone-tipo-nome">👧</span>
                            <span>

                            </span>
                        </button>

                        <button id="abrirPersonagens" class="botao-tipo-nome" type="button">
                            <span class="icone-tipo-nome">⭐</span>
                            <span>
                                <strong>Personagens</strong>
                                <small>Escolhe um nome divertido</small>

        <!-- JOGOS-->
        <section class="jogos">
            <a href="jogos/diferencas/index.html" class="card-jogo" aria-label="Abrir Jogo das Diferenças">
                <img src="recursos/jogo_diferencas.png" alt="Jogo das Diferenças">
            </a>
            <a href="jogos/memoria/index.html" class="card-jogo" aria-label="Abrir Jogo da Memória">
                <img src="recursos/jogo_memoria.png" alt="Jogo da Memória">

            <img id="corpoAmigo" src="" alt="Amigo escolhido">
        </section>

        <button id="botaoNomesRegistados" class="botao-nomes-registados" type="button">Nomes registados</button>

    <!-- POPUP DA COLEÇÃO DE BRINQUEDOS-->
    <div id="popupColecaoBrinquedos" class="popup-brinquedos">
        <div class="caixa-brinquedos">
            <h2>Os meus Brinquedos</h2>

            <div id="listaColecaoBrinquedos" class="lista-brinquedos"></div>

            <button id="fecharBrinquedos" class="fechar-brinquedos" type="button">Fechar</button>
        </div>
    </div>

    <!-- POPUP DOS NOMES REGISTADOS -->
    <div id="popupNomesRegistados" class="popup-registos">
        <div class="caixa-registos">

            <div class="cabecalho-registos">
                <h2>Nomes registados</h2>
                <button id="botaoBorracha" class="botao-borracha" type="button" aria-label="Ativar modo de apagar" title="Apagar registos">🧽</button>
                <button id="fecharNomesRegistados" class="fechar-registos" type="button" aria-label="Fechar">×</button>
            </div>

            <p class="texto-registos">
                Escolhe um registo para voltar a utilizá-lo.
            </p>

            <div id="listaNomesRegistados" class="lista-registos"></div>
        </div>
    </div>

    <!-- POPUP DO HISTÓRICO -->
    <div id="popupHistorico" class="popup-historico">
        <div class="caixa-historico">
            <div class="cabecalho-historico">
                <h2>Histórico</h2>

                <button id="fecharHistorico" class="fechar-registos" type="button" aria-label="Fechar">×</button>
            </div>

            <p class="texto-registos">Resultados do utilizador atual.</p>

            <div id="listaHistorico" class="lista-historico"></div>
        </div>
    </div>

    <script src="comum/dados.js"></script>

    <script src="comum/brinquedos.js"></script>
</body>
</html>
