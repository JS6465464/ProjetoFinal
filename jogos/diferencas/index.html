<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo das Diferenças</title>
    <link rel="icon" type="image/x-icon" href="recursos/imagens/icon.ico">
    <link rel="stylesheet" href="../../comum/utilizador.css">
    <link rel="stylesheet" href="../../comum/brinquedos.css">
    <link rel="stylesheet" href="jogo.css">
</head>

<body data-caminho-brinquedos="../../recursos/brinquedos/" data-caminho-recursos="../../recursos/"
>

    <main class="jogo">

        <!-- =====================================
             IMAGENS DO JOGO
        ====================================== -->

        <section class="zona-imagens">
            <img
                id="imagem-jogo"
                src=""
                alt="Jogo das diferenças"
            >

            <img
                id="tampa"
                src="recursos/tampa.png"
                alt="Observa e escolhe a resposta"
            >
        </section>


        <!-- =====================================
             PAINEL DO JOGO
        ====================================== -->

        <aside class="zona-lateral">

            <!-- CABEÇALHO -->

            <div class="cabecalho-jogo">
                <div class="marca-jogo">
                    <span>★</span>
                    MiniGénio
                    <span>★</span>
                </div>
                <h1>
                    Jogo das<br>
                    Diferenças
                </h1>
                <div
                    id="oportunidadesDiferencas"
                    class="oportunidades-diferencas"
                    aria-label="Oportunidades de brinquedo restantes"
                ></div>
            </div>


            <!-- UTILIZADOR E PONTUAÇÃO -->

            <div class="informacao-jogo">
                <div class="cartao-utilizador">
                    <span class="legenda-cartao">
                        Jogador
                    </span>
                    <p
                        id="nomeJogo"
                        class="nome-utilizador-jogo nome-diferencas"
                    ></p>
                </div>

                <div class="pontuacao">
                    <span class="legenda-cartao">
                        Pontuação
                    </span>
                    <strong id="valor-pontuacao">
                        0 / 0
                    </strong>
                </div>
            </div>

            <!-- RESPOSTAS -->

            <div class="titulo-respostas">
                Escolhe a resposta
            </div>
            <div id="respostas" class="respostas">
                <button
                    id="resposta1"
                    class="resposta"
                    type="button"
                ></button>
                <button
                    id="resposta2"
                    class="resposta"
                    type="button"
                ></button>
                <button
                    id="resposta3"
                    class="resposta"
                    type="button"
                ></button>
                <button
                    id="resposta4"
                    class="resposta"
                    type="button"
                ></button>
            </div>


            <!-- SEGUINTE -->

            <button
                id="seguinte"
                class="seguinte"
                type="button"
            >
                Seguinte
            </button>

            <!-- BOTÕES -->

            <div class="acoes-jogo">
                <button
                    id="botaoBrinquedos"
                    class="botao-brinquedos-jogo"
                    type="button"
                >
                    <span class="icone-acao">🧸</span>
                    <span>
                        Brinquedos
                    </span>
                </button>

                <button
                    id="home"
                    class="home"
                    type="button"
                >
                    <span class="icone-acao">🏠</span>
                    <span>
                        Home
                    </span>
                </button>
            </div>


            <!-- =====================================
                 AMIGO
                 SEM TEXTO
            ====================================== -->

            <div class="zona-amigo">
                <img
                    id="amigoJogo"
                    class="amigo-utilizador-jogo amigo-diferencas"
                    src=""
                    alt="Amigo escolhido"
                >
            </div>
        </aside>
    </main>


    <!-- =====================================
         COLEÇÃO DE BRINQUEDOS
    ====================================== -->

    <div id="popupColecaoBrinquedos" class="popup-brinquedos">
        <div class="caixa-brinquedos">
            <h2>
                Os meus Brinquedos
            </h2>
            <p>
                Estes são os brinquedos que já ganhaste.
            </p>
            <div
                id="listaColecaoBrinquedos"
                class="lista-brinquedos"
            ></div>
            <button
                id="fecharBrinquedos"
                class="fechar-brinquedos"
                type="button"
            >
                Fechar
            </button>
        </div>
    </div>

    <!-- =====================================
         ESCOLHER BRINQUEDO
    ====================================== -->

    <div id="popupEscolherBrinquedo" class="popup-brinquedos popup-escolher-brinquedo">
        <div class="tempo-brinquedo">
            <p class="texto-tempo-brinquedo">
                Tempo para escolher
            </p>
            <div
                id="contadorBrinquedo"
                class="contador-brinquedo"
            >
                10
            </div>
        </div>

        <div class="caixa-brinquedos">
            <h2>
                Escolhe um brinquedo!
            </h2>
            <p>
                Escolhe um antes que o tempo termine.
            </p>
            <div
                id="listaEscolherBrinquedo"
                class="lista-brinquedos"
            ></div>
        </div>
    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="../../comum/dados.js"></script>
    <script src="../../comum/utilizador.js"></script>
    <script src="../../comum/brinquedos.js"></script>
    <script src="jogo.js"></script>
</body>
</html>
