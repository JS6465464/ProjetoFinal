<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo das Diferenças</title>
    <link rel="stylesheet" href="../../comum/utilizador.css">
    <link rel="stylesheet" href="../../comum/brinquedos.css">
    <link rel="stylesheet" href="jogo.css">
</head>

<body data-caminho-brinquedos="../../recursos/brinquedos/" data-caminho-recursos="../../recursos/">

    <div class="jogo">

        <!-- ZONA DAS IMAGENS -->

        <div class="zona-imagens">

            <img
                id="imagem-jogo"
                src=""
                alt="Jogo das diferenças"
            >

            <img
                id="tampa"
                src="recursos/tampa.png"
                alt="Observa e escolhe a resposta"
            >

        </div>


        <!-- ZONA LATERAL -->

        <div class="zona-lateral">

            <h1>Jogo das Diferenças</h1>

            <div
                id="oportunidadesDiferencas"
                class="oportunidades-diferencas"
                aria-label="Oportunidades de brinquedo restantes"
            ></div>

            <p
                id="nomeJogo"
                class="nome-utilizador-jogo nome-diferencas"
            ></p>

            <div class="pontuacao">
                <p>Pontuação</p>
                <p id="valor-pontuacao">0 / 0</p>
            </div>

            <div id="respostas" class="respostas">
                <button id="resposta1" class="resposta" type="button"></button>
                <button id="resposta2" class="resposta" type="button"></button>
                <button id="resposta3" class="resposta" type="button"></button>
                <button id="resposta4" class="resposta" type="button"></button>
            </div>

            <button id="seguinte" class="seguinte" type="button">
                Seguinte
            </button>

            <button
                id="botaoBrinquedos"
                class="botao-brinquedos-jogo"
                type="button"
            >
                🧸 Brinquedos
            </button>

            <button id="home" class="home" type="button">
                Home
            </button>

        </div>

    </div>
    <!-- amigo escolhido -->

    <img
        id="amigoJogo"
        class="amigo-utilizador-jogo amigo-diferencas"
        src=""
        alt="Amigo escolhido"
    >


    <!-- popup da coleção -->

    <div id="popupColecaoBrinquedos" class="popup-brinquedos">
        <div class="caixa-brinquedos">
            <h2>Os meus Brinquedos</h2>

            <p>Estes são os brinquedos que já ganhaste.</p>

            <div
                id="listaColecaoBrinquedos"
                class="lista-brinquedos"
            ></div>

            <button
                id="fecharBrinquedos"
                class="fechar-brinquedos"
                type="button"
            >
                Fechar
            </button>
        </div>
    </div>


    <!-- popup escolher brnquedo-->

    <div
        id="popupEscolherBrinquedo"
        class="popup-brinquedos popup-escolher-brinquedo"
    >
        <div class="tempo-brinquedo">
            <p class="texto-tempo-brinquedo">
                Tempo para escolher
            </p>

            <div id="contadorBrinquedo" class="contador-brinquedo">
                10
            </div>
        </div>

        <div class="caixa-brinquedos">
            <h2>Escolhe um brinquedo!</h2>

            <p>Escolhe um antes que o tempo termine.</p>

            <div
                id="listaEscolherBrinquedo"
                class="lista-brinquedos"
            ></div>
        </div>
    </div>


    <!-- js -->

    <script src="../../comum/dados.js"></script>
    <script src="../../comum/utilizador.js"></script>
    <script src="../../comum/brinquedos.js"></script>
    <script src="jogo.js"></script>

</body>

</html>
