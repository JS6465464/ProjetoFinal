<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="jogo.css">
</head>
<body>
    <h1>Jogo da Memória</h1>
    <h2>Tenta encontrar todos os pares no menor tempo possível</h2>
    <button id="difficultyButton" data-difficulty="dificil">Mudar para modo difícil</button>
    <div class="game-info">
        <p> Tentativas: <span id="attempts">0</span></p>
    </div>
    <div class="memory-board" id="memory-board">
    </div>
    <button id="restartButton">Reiniciar jogo</button>

    <script src="jogo.js"></script>

</body>
</html>
